---
name: Trilium Notes
version: v0.101.3.9
upstream: v0.101.3
slug: trilium
description: Trilium Notes is a hierarchical note taking application with focus on building large personal knowledge bases.
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386

startup: services
boot: auto
init: false

map:
  - type: addon_config
    read_only: false


ingress: true
ingress_port: 8099
panel_icon: mdi:note-text

environment:
  TRILIUM_DATA_DIR: /config
  TRILIUM_NETWORK_PORT: "8080"
  TRILIUM_NETWORK_TRUSTEDREVERSEPROXY: "172.30.32.2"
  
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Direct Trilium (optional)

build:
  dockerfile: Dockerfile
  args:
    TRILIUM_IMAGE: "triliumnext/trilium:0.101.3"

webui: http://[HOST]:[PORT:8080]

