worker_processes  1;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50m;

    # ---- Common proxy headers (IMPORTANT: use $http_host to preserve :8123 when present) ----
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Keep scheme as seen by the browser (HA usually sends this)
    proxy_set_header X-Forwarded-Proto $scheme;

    # Allow sub_filter if you later need it (safe to keep)
    proxy_set_header Accept-Encoding "";

    # ---- CORS helper (for Trilium's /api/* preflight, since it 404s OPTIONS) ----
    # We return 204 to OPTIONS and include permissive headers.
    # This is what stops "rejected by browser" from killing content rendering.
    set $cors_allow_origin "*";

    # ------------------------------------------------------------
    # Redirect no-trailing-slash forms (helps ingress)
    # ------------------------------------------------------------
    location = /hassio/ingress/2b36e01f_trilium {
      return 302 /hassio/ingress/2b36e01f_trilium/;
    }

    location = /2b36e01f_trilium/ingress {
      return 302 /2b36e01f_trilium/ingress/;
    }

    # ------------------------------------------------------------
    # 1) HA Supervisor token ingress:
    #    /api/hassio_ingress/<token>/...
    # ------------------------------------------------------------
    location ~ ^/api/hassio_ingress/[^/]+/ {
      # Strip /api/hassio_ingress/<token>/ prefix
      rewrite ^/api/hassio_ingress/[^/]+/(.*)$ /$1 break;

      # Normalize the Trilium route that breaks with trailing slash
      rewrite ^/api/search/$ /api/search break;

      # Handle CORS preflight here (Trilium returns 404 for OPTIONS)
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        add_header Content-Type "text/plain; charset=utf-8" always;
        return 204;
      }

      proxy_pass http://127.0.0.1:8080;
      proxy_redirect off;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------
    # 2) HA frontend ingress style:
    #    /hassio/ingress/<slug>/...
    # ------------------------------------------------------------
    location ^~ /hassio/ingress/2b36e01f_trilium/ {
      # Strip prefix before proxying (Trilium docs pattern)
      rewrite ^/hassio/ingress/2b36e01f_trilium/(.*)$ /$1 break;

      # Normalize /api/search/
      rewrite ^/api/search/$ /api/search break;

      # CORS preflight
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        add_header Content-Type "text/plain; charset=utf-8" always;
        return 204;
      }

      proxy_pass http://127.0.0.1:8080;
      proxy_redirect off;

      # Keep cookies bound to this subpath so login sticks
      proxy_cookie_path / /hassio/ingress/2b36e01f_trilium;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------
    # 3) Alternate HA ingress style:
    #    /<slug>/ingress/...
    # ------------------------------------------------------------
    location ^~ /2b36e01f_trilium/ingress/ {
      rewrite ^/2b36e01f_trilium/ingress/(.*)$ /$1 break;

      rewrite ^/api/search/$ /api/search break;

      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        add_header Content-Type "text/plain; charset=utf-8" always;
        return 204;
      }

      proxy_pass http://127.0.0.1:8080;
      proxy_redirect off;

      proxy_cookie_path / /2b36e01f_trilium/ingress;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------
    # Direct access fallback (not ingress)
    # ------------------------------------------------------------
    location = /api/search/ {
      return 308 /api/search$is_args$args;
    }

    location / {
      proxy_pass http://127.0.0.1:8080;
      proxy_redirect off;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
