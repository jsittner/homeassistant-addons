worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        client_max_body_size 50m;

        # Basic Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Disable compression so sub_filter can modify the code on the fly
        proxy_set_header Accept-Encoding "";

        # ---------------------------------------------------------
        # Trilium Ingress Location
        # ---------------------------------------------------------
        location ~ ^(/(?:api/hassio_ingress|hassio/ingress|[^/]+/ingress))/([^/]+)(/.*)?$ {
            set $ingress_path $1/$2;
            set $rest $3;

            if ($rest = "") { set $rest "/"; }

            # --- CRITICAL FIX: ROUTER NOT FOUND ---
            # Trilium 404s if /api/search/ is requested with a trailing slash.
            # This regex catches /api/search/ and rewrites it to /api/search
            if ($rest ~* "^/api/search/(.*)$") {
                set $rest /api/search;
            }

            # --- FIX: REJECTED BY BROWSER (CORS) ---
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,X-Requested-With,X-HA-Access,trilium-hoisted-note-id,trilium-p-hoisted-note-id,trilium-device-id' always;
            add_header 'Access-Control-Expose-Headers' 'trilium-hoisted-note-id,trilium-p-hoisted-note-id' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,X-Requested-With,X-HA-Access,trilium-hoisted-note-id,trilium-p-hoisted-note-id,trilium-device-id' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://127.0.0.1:8080$rest$is_args$args;
            proxy_redirect off;
            proxy_cookie_path / $ingress_path/;

            # --- FIX: CSS, FONTS & JS PATHING ---
            sub_filter_once off;
            sub_filter_types text/css application/javascript application/json;

            # Rewrite absolute paths to be relative to the Ingress TOKEN
            sub_filter '"/api/' '"$ingress_path/api/';
            sub_filter "'/api/" "'$ingress_path/api/";
            sub_filter '"/assets/' '"$ingress_path/assets/';
            sub_filter "'/assets/" "'$ingress_path/assets/";
            sub_filter '"/static/' '"$ingress_path/static/';
            sub_filter "'/static/" "'$ingress_path/static/";

            # Rewrite HTML/CSS attributes
            sub_filter 'href="/' 'href="$ingress_path/';
            sub_filter 'src="/'  'src="$ingress_path/';
            sub_filter 'url(/'   'url($ingress_path/';
            sub_filter 'path: "/' 'path: "$ingress_path/';

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Catch-all for Direct Access
        location / {
            proxy_pass http://127.0.0.1:8080;
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
