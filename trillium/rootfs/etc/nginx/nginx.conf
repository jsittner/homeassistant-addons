worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50m;

    # ---- Redirect no-trailing-slash forms ----
    location = /hassio/ingress/2b36e01f_trilium {
      return 302 /hassio/ingress/2b36e01f_trilium/;
    }

    location = /2b36e01f_trilium/ingress {
      return 302 /2b36e01f_trilium/ingress/;
    }

    # ---- HA style: /hassio/ingress/<slug>/... ----
    location ^~ /hassio/ingress/2b36e01f_trilium/ {
      rewrite ^/hassio/ingress/2b36e01f_trilium/(.*)$ /$1 break;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_pass http://127.0.0.1:8080;
      proxy_redirect off;

      # Critical for subpath login/session
      proxy_cookie_path / /hassio/ingress/2b36e01f_trilium;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ---- HA style: /<slug>/ingress/... ----
    location ^~ /2b36e01f_trilium/ingress/ {
      rewrite ^/2b36e01f_trilium/ingress/(.*)$ /$1 break;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_pass http://127.0.0.1:8080;
      proxy_redirect off;

      proxy_cookie_path / /2b36e01f_trilium/ingress;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ---- Direct access fallback ----
    location / {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_pass http://127.0.0.1:8080;
      proxy_redirect off;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
