worker_processes  1;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50m;

    # Preserve :8123 when present
    proxy_set_header Host             $http_host;
    proxy_set_header X-Forwarded-Host $http_host;

    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Allow sub_filter (disable upstream compression)
    proxy_set_header Accept-Encoding "";

    # ------------------------------------------------------------
    # GLOBAL FIX: Trilium returns 404 to OPTIONS on /api/*
    # This breaks the browser (CORS/preflight) and results in "rejected by browser".
    # We answer OPTIONS here and never send it to Trilium.
    # ------------------------------------------------------------
    location ^~ /api/ {
      # Normalize this picky endpoint when someone hits it directly
      if ($uri = /api/search/) {
        return 308 /api/search$is_args$args;
      }

      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        add_header Content-Type "text/plain; charset=utf-8" always;
        return 204;
      }

      # If something *does* end up calling /api/... without ingress prefix,
      # at least make it work.
      add_header Access-Control-Allow-Origin "*" always;
      proxy_pass http://127.0.0.1:8080;
      proxy_redirect off;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------
    # Redirect no-trailing-slash ingress forms
    # ------------------------------------------------------------
    location = /hassio/ingress/2b36e01f_trilium {
      return 302 /hassio/ingress/2b36e01f_trilium/;
    }

    location = /2b36e01f_trilium/ingress {
      return 302 /2b36e01f_trilium/ingress/;
    }

    # ------------------------------------------------------------
    # 1) HA Supervisor token ingress:
    # /api/hassio_ingress/<token>/...
    # ------------------------------------------------------------
    location ~ ^/api/hassio_ingress/([^/]+)(/.*)?$ {
      set $token $1;
      set $rest  $2;

      if ($rest = "") { set $rest "/"; }
      if ($rest = "/api/search/") { set $rest "/api/search"; }

      set $ingress_prefix /api/hassio_ingress/$token;

      # CORS preflight at ingress path too
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        add_header Content-Type "text/plain; charset=utf-8" always;
        return 204;
      }

      proxy_redirect off;
      proxy_cookie_path / $ingress_prefix/;

      # Rewrite absolute /api and /assets inside HTML/JS/CSS to include token prefix
      sub_filter_once off;
      sub_filter_types text/html text/css application/javascript application/json;

      sub_filter '"/api/'     '"$ingress_prefix/api/';
      sub_filter "'/api/"     "'$ingress_prefix/api/";
      sub_filter '"/assets/'  '"$ingress_prefix/assets/';
      sub_filter "'/assets/"  "'$ingress_prefix/assets/";

      sub_filter 'href="/'    'href="$ingress_prefix/';
      sub_filter 'src="/'     'src="$ingress_prefix/';
      sub_filter 'action="/'  'action="$ingress_prefix/';

      sub_filter 'url(/'      'url($ingress_prefix/';
      sub_filter 'url("/'     'url("$ingress_prefix/';
      sub_filter "url('/"     "url('$ingress_prefix/";

      proxy_pass http://127.0.0.1:8080$rest$is_args$args;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------
    # 2) HA frontend ingress: /hassio/ingress/<slug>/...
    # ------------------------------------------------------------
    location ^~ /hassio/ingress/2b36e01f_trilium/ {
      rewrite ^/hassio/ingress/2b36e01f_trilium/(.*)$ /$1 break;

      # normalize trailing slash variant
      rewrite ^/api/search/$ /api/search break;

      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        add_header Content-Type "text/plain; charset=utf-8" always;
        return 204;
      }

      proxy_cookie_path / /hassio/ingress/2b36e01f_trilium;
      proxy_pass http://127.0.0.1:8080;
      proxy_redirect off;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------
    # 3) Alternate HA ingress: /<slug>/ingress/...
    # ------------------------------------------------------------
    location ^~ /2b36e01f_trilium/ingress/ {
      rewrite ^/2b36e01f_trilium/ingress/(.*)$ /$1 break;

      rewrite ^/api/search/$ /api/search break;

      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        add_header Content-Type "text/plain; charset=utf-8" always;
        return 204;
      }

      proxy_cookie_path / /2b36e01f_trilium/ingress;
      proxy_pass http://127.0.0.1:8080;
      proxy_redirect off;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------
    # Direct fallback (should rarely be used now)
    # ------------------------------------------------------------
    location / {
      proxy_pass http://127.0.0.1:8080;
      proxy_redirect off;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
