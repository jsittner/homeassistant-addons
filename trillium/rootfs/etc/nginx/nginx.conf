worker_processes  1;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  # Websocket helper
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    client_max_body_size 50m;

    # ------------------------------------------------------------
    # Ingress mode
    # Matches BOTH of these patterns:
    #   /api/hassio_ingress/<TOKEN>/...
    #   /hassio/ingress/<SLUG>/...
    # ------------------------------------------------------------
    location ~ ^(?<ingress_prefix>/api/hassio_ingress/[^/]+|/hassio/ingress/[^/]+)(?<rest>/.*)?$ {

      # If request is exactly the prefix with no trailing path
      if ($rest = "") { set $rest "/"; }

      # Normalize the one problematic endpoint (Trilium sometimes hits /api/search/)
      if ($rest = "/api/search/") { set $rest "/api/search"; }

      # ---- Proxy headers ----
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Preserve ingress hint headers (useful for debugging)
      proxy_set_header X-Ingress-Path $http_x_ingress_path;
      proxy_set_header X-Forwarded-Prefix $ingress_prefix;

      # Cookies must be scoped under the ingress prefix so sessions stick
      proxy_cookie_path / $ingress_prefix/;

      # Trilium upstream
      proxy_pass http://127.0.0.1:8080$rest$is_args$args;
      proxy_redirect off;

      # ------------------------------------------------------------
      # Fix Trilium running under a sub-path:
      #
      # 1) Replace <base href="/"> with <base href="<ingress_prefix>/">
      # 2) Inject a small script to force window.glob.baseUrl and baseApiUrl
      #    to be RELATIVE and under the ingress prefix.
      #
      # This prevents the frontend from ever calling:
      #   http://homeassistant.home/api/...
      # (which causes the exact CORS/OPTIONS failures you’re seeing)
      # ------------------------------------------------------------
      proxy_set_header Accept-Encoding "";

      sub_filter_once off;
      sub_filter_types text/html;

      # If Trilium emits a base tag, rewrite it to ingress prefix
      sub_filter '<base href="/">' '<base href="$ingress_prefix/">';
      sub_filter '<base href="/"/>' '<base href="$ingress_prefix/"/>';

      # Inject script just before </head>
      sub_filter '</head>' '<script>
(function () {
  var p = location.pathname;
  var m = p.match(/^(\\/api\\/hassio_ingress\\/[^\\/]+|\\/hassio\\/ingress\\/[^\\/]+)/);
  var prefix = m ? m[1] : "";
  window.glob = window.glob || {};
  // Force RELATIVE paths so port stays :8123 and prefix stays intact
  window.glob.baseUrl = prefix + "/";
  window.glob.baseApiUrl = prefix + "/api/";
})();
</script></head>';

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------
    # Non-ingress (direct) mode: plain proxy to Trilium
    # ------------------------------------------------------------
    location / {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_pass http://127.0.0.1:8080;
      proxy_redirect off;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
