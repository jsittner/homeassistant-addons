worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  server {
    listen 80;

    client_max_body_size 50m;

    location ~ ^/api/hassio_ingress/[^/]+/(.*)$ {
      set $rest /$1;

      # Normalize the problematic trailing-slash route
      if ($rest = "/api/search/") { set $rest "/api/search"; }

      proxy_pass http://127.0.0.1:8080$rest$is_args$args;

      proxy_http_version 1.1;

      # WebSocket / upgrade headers (safe even for normal HTTP)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_redirect off;

      # Cookie path rewrite for ingress sessions
      proxy_cookie_path / /api/hassio_ingress/;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Direct (non-ingress) normalize for /api/search/
    location = /api/search/ {
      return 308 /api/search$is_args$args;
    }

    # Everything else (direct access on port 80)
    location / {
      proxy_pass http://127.0.0.1:8080;

      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_redirect off;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
