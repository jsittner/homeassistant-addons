worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  server {
    listen 80;

    client_max_body_size 50m;

    #
    # Ingress path: /api/hassio_ingress/<token>/...
    # Strip prefix and proxy to Trilium.
    #
    location ~ ^/api/hassio_ingress/[^/]+/(.*)$ {
      set $rest /$1;

      # Normalize the problematic trailing-slash route
      if ($rest = "/api/search/") { set $rest "/api/search"; }

      #
      # Fix: Trilium returns 404 for OPTIONS /api/search, which breaks browser preflight.
      # Intercept OPTIONS and respond 204 with permissive headers.
      #
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        return 204;
      }

      proxy_pass http://127.0.0.1:8080$rest$is_args$args;

      proxy_http_version 1.1;

      # WebSocket / upgrade headers (safe even for normal HTTP)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_redirect off;

      # Cookie path rewrite for ingress sessions
      proxy_cookie_path / /api/hassio_ingress/;

      # Also add CORS headers on proxied responses (harmless for same-origin)
      add_header Access-Control-Allow-Origin "*" always;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    #
    # Direct access: normalize /api/search/ -> /api/search
    #
    location = /api/search/ {
      return 308 /api/search$is_args$args;
    }

    #
    # Direct access: handle OPTIONS /api/search for preflight
    #
    location = /api/search {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        return 204;
      }

      proxy_pass http://127.0.0.1:8080/api/search$is_args$args;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_redirect off;
      add_header Access-Control-Allow-Origin "*" always;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    #
    # Everything else (direct access on port 80)
    #
    location / {
      proxy_pass http://127.0.0.1:8080;

      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_redirect off;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
