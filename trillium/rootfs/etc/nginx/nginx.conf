worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  # If Home Assistant ingress is in use, it sets X-Ingress-Path.
  # Example value:
  #   /api/hassio_ingress/<token>
  #
  # When not using ingress, header is empty.
  map $http_x_ingress_path $ingress_path {
    default $http_x_ingress_path;
    ""      "";
  }

  # Cookie path rewrite target:
  # - ingress: /api/hassio_ingress/<token>/
  # - direct:  /
  map $http_x_ingress_path $cookie_path {
    default "$http_x_ingress_path/";
    ""      "/";
  }

  server {
    listen 80;

    client_max_body_size 50m;

    #
    # 1) Handle requests that come in via Home Assistant ingress prefix:
    #    /api/hassio_ingress/<token>/...
    #
    location ~ ^/api/hassio_ingress/[^/]+/(.*)$ {
      set $rest /$1;

      # Normalize trailing slash
      if ($rest = "/api/search/") { set $rest "/api/search"; }

      # CORS preflight fix for /api/search (browser was rejecting)
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        return 204;
      }

      proxy_pass http://127.0.0.1:8080$rest$is_args$args;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_redirect off;
      proxy_cookie_path / $cookie_path;

      # --- Ingress subpath rewrite ---
      # Rewrite absolute URLs in responses so the UI/editor can load assets and call APIs under ingress.
      sub_filter_once off;
      sub_filter_types text/html application/javascript text/css;

      # API calls
      sub_filter '"/api/' '"$ingress_path/api/';
      sub_filter "'/api/" "'$ingress_path/api/";

      # Asset / navigation absolute paths
      sub_filter 'href="/' 'href="$ingress_path/';
      sub_filter 'src="/'  'src="$ingress_path/';
      sub_filter 'action="/' 'action="$ingress_path/';

      # Some builds use <base href="/">; fix it when present
      sub_filter '<base href="/">' '<base href="$ingress_path/">';
      sub_filter '<base href="/"/>' '<base href="$ingress_path/"/>';

      # CORS header (harmless for same-origin, helps if editor does odd requests)
      add_header Access-Control-Allow-Origin "*" always;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    #
    # 2) Direct access: normalize /api/search/ -> /api/search
    #
    location = /api/search/ {
      return 308 /api/search$is_args$args;
    }

    #
    # 3) Direct access: handle OPTIONS /api/search preflight
    #
    location = /api/search {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        return 204;
      }

      proxy_pass http://127.0.0.1:8080/api/search$is_args$args;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_redirect off;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    #
    # 4) Everything else (direct access on port 80)
    #
    location / {
      proxy_pass http://127.0.0.1:8080;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_redirect off;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
