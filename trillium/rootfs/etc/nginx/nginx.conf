worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  server {
    listen 80;
    client_max_body_size 50m;

    #
    # Shared proxy settings (we’ll repeat inside locations since nginx
    # doesn’t let us “include” without another file).
    #

    #
    # 1) HA Supervisor style:
    #    /api/hassio_ingress/<token>/...
    #
    location ~ ^/api/hassio_ingress/([^/]+)/(.*)$ {
      set $ingress_path /api/hassio_ingress/$1;
      set $rest /$2;

      # Normalize /api/search/ -> /api/search (avoid route mismatch)
      if ($rest = "/api/search/") { set $rest "/api/search"; }

      # Allow sub_filter (disable upstream compression)
      proxy_set_header Accept-Encoding "";

      # Handle preflight so browser doesn’t reject
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        return 204;
      }

      proxy_pass http://127.0.0.1:8080$rest$is_args$args;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_redirect off;
      proxy_cookie_path / $ingress_path/;

      # Rewrite absolute URLs for subpath operation
      sub_filter_once off;
      sub_filter_types *;

      sub_filter '"/api/' '"$ingress_path/api/';
      sub_filter "'/api/" "'$ingress_path/api/";

      sub_filter '"/assets/' '"$ingress_path/assets/';
      sub_filter "'/assets/" "'$ingress_path/assets/";

      sub_filter 'href="/' 'href="$ingress_path/';
      sub_filter 'src="/'  'src="$ingress_path/';
      sub_filter 'action="/' 'action="$ingress_path/';

      sub_filter '<base href="/">' '<base href="$ingress_path/">';
      sub_filter '<base href="/"/>' '<base href="$ingress_path/"/>';

      sub_filter 'url(/' 'url($ingress_path/';

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    #
    # 2) HA frontend style:
    #    /hassio/ingress/<slug>/...
    #
    location ~ ^/hassio/ingress/([^/]+)/(.*)$ {
      set $ingress_path /hassio/ingress/$1;
      set $rest /$2;

      if ($rest = "/api/search/") { set $rest "/api/search"; }

      proxy_set_header Accept-Encoding "";

      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        return 204;
      }

      proxy_pass http://127.0.0.1:8080$rest$is_args$args;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_redirect off;
      proxy_cookie_path / $ingress_path/;

      sub_filter_once off;
      sub_filter_types *;

      sub_filter '"/api/' '"$ingress_path/api/';
      sub_filter "'/api/" "'$ingress_path/api/";

      sub_filter '"/assets/' '"$ingress_path/assets/';
      sub_filter "'/assets/" "'$ingress_path/assets/";

      sub_filter 'href="/' 'href="$ingress_path/';
      sub_filter 'src="/'  'src="$ingress_path/';
      sub_filter 'action="/' 'action="$ingress_path/';

      sub_filter '<base href="/">' '<base href="$ingress_path/">';
      sub_filter '<base href="/"/>' '<base href="$ingress_path/"/>';

      sub_filter 'url(/' 'url($ingress_path/';

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    #
    # 3) Alternative HA style you’re seeing:
    #    /<slug>/ingress/...
    #
    location ~ ^/([^/]+)/ingress/(.*)$ {
      set $ingress_path /$1/ingress;
      set $rest /$2;

      if ($rest = "/api/search/") { set $rest "/api/search"; }

      proxy_set_header Accept-Encoding "";

      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        return 204;
      }

      proxy_pass http://127.0.0.1:8080$rest$is_args$args;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_redirect off;
      proxy_cookie_path / $ingress_path/;

      sub_filter_once off;
      sub_filter_types *;

      sub_filter '"/api/' '"$ingress_path/api/';
      sub_filter "'/api/" "'$ingress_path/api/";

      sub_filter '"/assets/' '"$ingress_path/assets/';
      sub_filter "'/assets/" "'$ingress_path/assets/";

      sub_filter 'href="/' 'href="$ingress_path/';
      sub_filter 'src="/'  'src="$ingress_path/';
      sub_filter 'action="/' 'action="$ingress_path/';

      sub_filter '<base href="/">' '<base href="$ingress_path/">';
      sub_filter '<base href="/"/>' '<base href="$ingress_path/"/>';

      sub_filter 'url(/' 'url($ingress_path/';

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    #
    # Direct access helpers
    #
    location = /api/search/ {
      return 308 /api/search$is_args$args;
    }

    # Direct access (port 80)
    location / {
      proxy_pass http://127.0.0.1:8080;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_redirect off;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
