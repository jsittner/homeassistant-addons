worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  map $http_x_ingress_path $ingress_path {
    default $http_x_ingress_path;
    ""      "";
  }

  map $http_x_ingress_path $cookie_path {
    default "$http_x_ingress_path/";
    ""      "/";
  }

  server {
    listen 80;

    client_max_body_size 50m;

    #
    # Ingress requests: /api/hassio_ingress/<token>/...
    #
    location ~ ^/api/hassio_ingress/[^/]+/(.*)$ {
      set $rest /$1;

      # Normalize /api/search/ -> /api/search
      if ($rest = "/api/search/") { set $rest "/api/search"; }

      # IMPORTANT: disable upstream compression so sub_filter can work
      proxy_set_header Accept-Encoding "";

      # Generic preflight handler (covers /api/search and anything else)
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        return 204;
      }

      proxy_pass http://127.0.0.1:8080$rest$is_args$args;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_redirect off;
      proxy_cookie_path / $cookie_path;

      # Helps browsers be strict about MIME (if CSS is wrong, you’ll see it clearly)
      add_header X-Content-Type-Options "nosniff" always;

      # --- Ingress subpath rewrite ---
      # Apply sub_filter to EVERYTHING because Trilium may serve JS/CSS as text/plain or octet-stream.
      sub_filter_once off;
      sub_filter_types *;

      # API calls
      sub_filter '"/api/' '"$ingress_path/api/';
      sub_filter "'/api/" "'$ingress_path/api/";

      # Assets explicitly
      sub_filter '"/assets/' '"$ingress_path/assets/';
      sub_filter "'/assets/" "'$ingress_path/assets/";

      # Generic absolute links
      sub_filter 'href="/' 'href="$ingress_path/';
      sub_filter 'src="/'  'src="$ingress_path/';
      sub_filter 'action="/' 'action="$ingress_path/';

      # base href
      sub_filter '<base href="/">' '<base href="$ingress_path/">';
      sub_filter '<base href="/"/>' '<base href="$ingress_path/"/>';

      # CSS url(/...) references
      sub_filter 'url(/' 'url($ingress_path/';

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    #
    # Direct access: normalize /api/search/ -> /api/search
    #
    location = /api/search/ {
      return 308 /api/search$is_args$args;
    }

    #
    # Direct access: preflight just in case
    #
    location ~ ^/api/ {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        return 204;
      }

      proxy_pass http://127.0.0.1:8080;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_redirect off;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    #
    # Everything else (direct access on port 80)
    #
    location / {
      proxy_pass http://127.0.0.1:8080;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_redirect off;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
