worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        client_max_body_size 50m;

        # Basic Proxy Settings
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Disable compression so Nginx can search/replace text in JS/CSS
        proxy_set_header Accept-Encoding "";

        # 1, 2, 3: The Unified Ingress Handler
        location ~ ^(/(?:api/hassio_ingress|hassio/ingress|[^/]+/ingress))/([^/]+)?(/(.*))?$ {
            set $ingress_path $1/$2;
            set $rest $3;

            if ($rest = "") { set $rest "/"; }
            if ($rest = "/api/search/") { set $rest "/api/search"; }

            # --- THE FIX: TRILIUM CORS HEADERS ---
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,X-Requested-With,X-HA-Access,trilium-hoisted-note-id,trilium-p-hoisted-note-id,trilium-device-id' always;
            add_header 'Access-Control-Expose-Headers' 'trilium-hoisted-note-id,trilium-p-hoisted-note-id' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,X-Requested-With,X-HA-Access,trilium-hoisted-note-id,trilium-p-hoisted-note-id,trilium-device-id' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://127.0.0.1:8080$rest$is_args$args;
            proxy_redirect off;
            proxy_cookie_path / $ingress_path/;

            # --- SUB_FILTER BLOCK: REWRITING PATHS ---
            sub_filter_once off;
            # Note: Removed text/html from here as it's default; keeps nginx happy
            sub_filter_types text/css application/javascript application/json;

            # Rewrite API and Asset paths
            sub_filter '"/api/' '"$ingress_path/api/';
            sub_filter "'/api/" "'$ingress_path/api/";
            sub_filter '"/assets/' '"$ingress_path/assets/';
            sub_filter "'/assets/" "'$ingress_path/assets/";
            
            # Rewrite Static/Font paths (Found in your logs)
            sub_filter '"/static/' '"$ingress_path/static/';
            sub_filter "'/static/" "'$ingress_path/static/";

            # Rewrite HTML attributes
            sub_filter 'href="/' 'href="$ingress_path/';
            sub_filter 'src="/'  'src="$ingress_path/';
            sub_filter 'action="/' 'action="$ingress_path/';
            
            # Rewrite CSS url() calls
            sub_filter 'url(/' 'url($ingress_path/';
            sub_filter 'url("/' 'url("$ingress_path/';
            sub_filter "url('/" "url('$ingress_path/";

            # Fix Base Href
            sub_filter '<base href="/">' '<base href="$ingress_path/">';
            sub_filter '<base href="/"/>' '<base href="$ingress_path/"/>';

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Catch-all for Root Access
        location / {
            proxy_pass http://127.0.0.1:8080;
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
