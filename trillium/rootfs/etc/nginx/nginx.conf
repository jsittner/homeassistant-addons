worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  # Ingress path header set by Home Assistant when using ingress.
  # Example:
  #   /api/hassio_ingress/<token>
  map $http_x_ingress_path $ingress_path {
    default $http_x_ingress_path;
    ""      "";
  }

  # Cookie path rewrite target:
  # - ingress: /api/hassio_ingress/<token>/
  # - direct:  /
  map $http_x_ingress_path $cookie_path {
    default "$http_x_ingress_path/";
    ""      "/";
  }

  server {
    listen 80;

    client_max_body_size 50m;

    #
    # Ingress requests: /api/hassio_ingress/<token>/...
    # Strip prefix and proxy to Trilium. Also rewrite absolute URLs in HTML/JS/CSS
    # so the app works correctly under the ingress subpath.
    #
    location ~ ^/api/hassio_ingress/[^/]+/(.*)$ {
      set $rest /$1;

      # Normalize trailing slash
      if ($rest = "/api/search/") { set $rest "/api/search"; }

      # IMPORTANT: disable upstream compression so sub_filter can rewrite content
      proxy_set_header Accept-Encoding "";

      # Fix: Trilium returns 404 for OPTIONS /api/search, which breaks browser preflight.
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        return 204;
      }

      proxy_pass http://127.0.0.1:8080$rest$is_args$args;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_redirect off;
      proxy_cookie_path / $cookie_path;

      # Add permissive CORS header (harmless for same-origin, helps if editor does odd requests)
      add_header Access-Control-Allow-Origin "*" always;

      # --- Ingress subpath rewrite (HTML/JS/CSS) ---
      sub_filter_once off;
      sub_filter_types text/html application/javascript text/css;

      # API calls
      sub_filter '"/api/' '"$ingress_path/api/';
      sub_filter "'/api/" "'$ingress_path/api/";

      # Assets explicitly
      sub_filter '"/assets/' '"$ingress_path/assets/';
      sub_filter "'/assets/" "'$ingress_path/assets/";

      # Generic absolute links for assets and navigation
      sub_filter 'href="/' 'href="$ingress_path/';
      sub_filter 'src="/'  'src="$ingress_path/';
      sub_filter 'action="/' 'action="$ingress_path/';

      # Some builds use <base href="/">; fix it when present
      sub_filter '<base href="/">' '<base href="$ingress_path/">';
      sub_filter '<base href="/"/>' '<base href="$ingress_path/"/>';

      # CSS asset URLs like url(/assets/...)
      sub_filter 'url(/' 'url($ingress_path/';

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    #
    # Direct access: normalize /api/search/ -> /api/search
    #
    location = /api/search/ {
      return 308 /api/search$is_args$args;
    }

    #
    # Direct access: handle OPTIONS /api/search preflight (just in case)
    #
    location = /api/search {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        return 204;
      }

      proxy_pass http://127.0.0.1:8080/api/search$is_args$args;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_redirect off;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    #
    # Everything else (direct access on port 80)
    #
    location / {
      proxy_pass http://127.0.0.1:8080;

      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_redirect off;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
