worker_processes  1;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  # Websocket helper
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    client_max_body_size 50m;

    # ------------------------------
    # Ingress paths (HA)
    # ------------------------------
    location ~ ^(?<ingress_prefix>/api/hassio_ingress/[^/]+|/hassio/ingress/[^/]+)(?<rest>/.*)?$ {

      # Default to /
      if ($rest = "") { set $rest "/"; }

      # --- CRITICAL FIX ---
      # Browser strips the fragment, so XHR to /api/search/#textSnippet becomes /api/search/
      # Reconstruct based on Referer fragment.
      if ($rest = "/api/search/") {
        # Most common cases seen in your logs
        if ($http_referer ~* "#textSnippet") {
          set $rest "/api/search/%23textSnippet";
        }
        if ($http_referer ~* "#workspace") {
          # This matches things like "#workspace #!template"
          set $rest "/api/search/%23workspace%20%23!template";
        }
      }

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Keep sessions working under ingress
      proxy_cookie_path / $ingress_prefix/;

      proxy_pass http://127.0.0.1:8080$rest$is_args$args;
      proxy_redirect off;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ------------------------------
    # Direct (non-ingress) access
    # ------------------------------
    location / {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_pass http://127.0.0.1:8080;
      proxy_redirect off;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
 
