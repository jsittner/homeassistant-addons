worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50m;

    # Common proxy headers
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Allow sub_filter (disable upstream compression)
    proxy_set_header Accept-Encoding "";

    # ------------------------------------------------------------------
    # Redirect no-trailing-slash forms (prevents nginx default page / bad relative paths)
    # ------------------------------------------------------------------
    location = /hassio/ingress/2b36e01f_trilium {
      return 302 /hassio/ingress/2b36e01f_trilium/;
    }

    location = /2b36e01f_trilium/ingress {
      return 302 /2b36e01f_trilium/ingress/;
    }

    # ------------------------------------------------------------------
    # 1) HA Supervisor token ingress:
    #    /api/hassio_ingress/<token>/...
    # ------------------------------------------------------------------
    location ~ ^/api/hassio_ingress/[^/]+/ {
      # Strip /api/hassio_ingress/<token>/ prefix
      rewrite ^/api/hassio_ingress/[^/]+/(.*)$ /$1 break;

      # Trilium expects /api/search (no trailing slash)
      rewrite ^/api/search/$ /api/search break;

      proxy_pass http://127.0.0.1:8080;
      proxy_redirect off;

      # Rewrite absolute paths so assets + API work under the token prefix
      # NOTE: we can't reliably know the token string inside the response body,
      # so we rewrite /api and /assets to relative under the current base.
      sub_filter_once off;
      sub_filter_types *;

      # Prefer relative paths to avoid hardcoding token
      sub_filter '"/api/' '"/api/';
      sub_filter "'/api/" "'/api/";
      sub_filter '"/assets/' '"/assets/';
      sub_filter "'/assets/" "'/assets/";

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------------
    # 2) HA frontend ingress style:
    #    /hassio/ingress/<slug>/...
    # ------------------------------------------------------------------
    location ^~ /hassio/ingress/2b36e01f_trilium/ {
      # Strip prefix before proxying (Trilium "serve under path" pattern)
      rewrite ^/hassio/ingress/2b36e01f_trilium/(.*)$ /$1 break;

      # Trilium expects /api/search (no trailing slash)
      rewrite ^/api/search/$ /api/search break;

      proxy_pass http://127.0.0.1:8080;
      proxy_redirect off;

      # Keep cookies bound to the subpath (stay logged in)
      proxy_cookie_path / /hassio/ingress/2b36e01f_trilium;

      # Fix absolute URLs inside HTML/JS/CSS
      sub_filter_once off;
      sub_filter_types *;

      sub_filter '"/api/'    '"/hassio/ingress/2b36e01f_trilium/api/';
      sub_filter "'/api/"    "'/hassio/ingress/2b36e01f_trilium/api/";
      sub_filter '"/assets/' '"/hassio/ingress/2b36e01f_trilium/assets/';
      sub_filter "'/assets/" "'/hassio/ingress/2b36e01f_trilium/assets/";

      sub_filter 'href="/'   'href="/hassio/ingress/2b36e01f_trilium/';
      sub_filter 'src="/'    'src="/hassio/ingress/2b36e01f_trilium/';
      sub_filter 'action="/' 'action="/hassio/ingress/2b36e01f_trilium/';

      sub_filter 'url(/'     'url(/hassio/ingress/2b36e01f_trilium/';

      # Base href (if present)
      sub_filter '<base href="/">' '<base href="/hassio/ingress/2b36e01f_trilium/">';
      sub_filter '<base href="/"/>' '<base href="/hassio/ingress/2b36e01f_trilium/"/>';

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------------
    # 3) Alternate HA ingress style:
    #    /<slug>/ingress/...
    # ------------------------------------------------------------------
    location ^~ /2b36e01f_trilium/ingress/ {
      rewrite ^/2b36e01f_trilium/ingress/(.*)$ /$1 break;

      # Trilium expects /api/search (no trailing slash)
      rewrite ^/api/search/$ /api/search break;

      proxy_pass http://127.0.0.1:8080;
      proxy_redirect off;

      proxy_cookie_path / /2b36e01f_trilium/ingress;

      sub_filter_once off;
      sub_filter_types *;

      sub_filter '"/api/'    '"/2b36e01f_trilium/ingress/api/';
      sub_filter "'/api/"    "'/2b36e01f_trilium/ingress/api/";
      sub_filter '"/assets/' '"/2b36e01f_trilium/ingress/assets/';
      sub_filter "'/assets/" "'/2b36e01f_trilium/ingress/assets/";

      sub_filter 'href="/'   'href="/2b36e01f_trilium/ingress/';
      sub_filter 'src="/'    'src="/2b36e01f_trilium/ingress/';
      sub_filter 'action="/' 'action="/2b36e01f_trilium/ingress/';

      sub_filter 'url(/'     'url(/2b36e01f_trilium/ingress/';

      sub_filter '<base href="/">' '<base href="/2b36e01f_trilium/ingress/">';
      sub_filter '<base href="/"/>' '<base href="/2b36e01f_trilium/ingress/"/>';

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------------
    # Direct access fallback (port 80 inside addon container)
    # ------------------------------------------------------------------
    location = /api/search/ {
      return 308 /api/search$is_args$args;
    }

    location / {
      proxy_pass http://127.0.0.1:8080;
      proxy_redirect off;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
