worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50m;

    # Standard proxy headers
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Let sub_filter work
    proxy_set_header Accept-Encoding "";

    #
    # If HA hits without trailing slash, force it (prevents the nginx welcome fallback)
    #
    location = /hassio/ingress/2b36e01f_trilium {
      return 302 /hassio/ingress/2b36e01f_trilium/;
    }

    location = /2b36e01f_trilium/ingress {
      return 302 /2b36e01f_trilium/ingress/;
    }

    #
    # HA frontend ingress style: /hassio/ingress/<slug>/...
    #
    location ^~ /hassio/ingress/2b36e01f_trilium/ {
      # Strip the prefix before sending to Trilium
      rewrite ^/hassio/ingress/2b36e01f_trilium/(.*)$ /$1 break;

      proxy_pass http://127.0.0.1:8080;
      proxy_redirect off;
      proxy_cookie_path / /hassio/ingress/2b36e01f_trilium/;

      # Rewrite absolute URLs so Trilium works under the subpath
      sub_filter_once off;
      sub_filter_types *;

      sub_filter '"/api/'    '"/hassio/ingress/2b36e01f_trilium/api/';
      sub_filter "'/api/"    "'/hassio/ingress/2b36e01f_trilium/api/";
      sub_filter '"/assets/' '"/hassio/ingress/2b36e01f_trilium/assets/';
      sub_filter "'/assets/" "'/hassio/ingress/2b36e01f_trilium/assets/";

      sub_filter 'href="/'   'href="/hassio/ingress/2b36e01f_trilium/';
      sub_filter 'src="/'    'src="/hassio/ingress/2b36e01f_trilium/';
      sub_filter 'action="/' 'action="/hassio/ingress/2b36e01f_trilium/';

      sub_filter 'url(/'     'url(/hassio/ingress/2b36e01f_trilium/';

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    #
    # Alternate HA style you’ve seen: /<slug>/ingress/...
    #
    location ^~ /2b36e01f_trilium/ingress/ {
      rewrite ^/2b36e01f_trilium/ingress/(.*)$ /$1 break;

      proxy_pass http://127.0.0.1:8080;
      proxy_redirect off;
      proxy_cookie_path / /2b36e01f_trilium/ingress/;

      sub_filter_once off;
      sub_filter_types *;

      sub_filter '"/api/'    '"/2b36e01f_trilium/ingress/api/';
      sub_filter "'/api/"    "'/2b36e01f_trilium/ingress/api/";
      sub_filter '"/assets/' '"/2b36e01f_trilium/ingress/assets/';
      sub_filter "'/assets/" "'/2b36e01f_trilium/ingress/assets/";

      sub_filter 'href="/'   'href="/2b36e01f_trilium/ingress/';
      sub_filter 'src="/'    'src="/2b36e01f_trilium/ingress/';
      sub_filter 'action="/' 'action="/2b36e01f_trilium/ingress/';

      sub_filter 'url(/'     'url(/2b36e01f_trilium/ingress/';

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    #
    # Supervisor token style: /api/hassio_ingress/<token>/...
    # (This is what the JS stack traces were using earlier.)
    #
    location ~ ^/api/hassio_ingress/[^/]+/ {
      # Strip /api/hassio_ingress/<token>/ prefix
      rewrite ^/api/hassio_ingress/[^/]+/(.*)$ /$1 break;

      proxy_pass http://127.0.0.1:8080;
      proxy_redirect off;
      # Cookie path rewrite is tricky with token, but keeping it generic is usually fine
      proxy_cookie_path / /api/hassio_ingress/;

      sub_filter_once off;
      sub_filter_types *;

      sub_filter '"/api/'    '"/api/hassio_ingress/$http_x_hassio_ingress/api/';
      sub_filter "'/api/"    "'/api/hassio_ingress/$http_x_hassio_ingress/api/";
      sub_filter '"/assets/' '"/api/hassio_ingress/$http_x_hassio_ingress/assets/';
      sub_filter "'/assets/" "'/api/hassio_ingress/$http_x_hassio_ingress/assets/";

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    #
    # IMPORTANT: never serve the nginx default site.
    # If none of the above matches, still proxy to Trilium.
    #
    location / {
      proxy_pass http://127.0.0.1:8080;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
