worker_processes 1;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;

    client_max_body_size 50m;

    # Home Assistant ingress provides this header when proxied via ingress.
    # Example: /api/hassio_ingress/16Sa-CzqU03hphxYB7XSCXMQzJyn9MWHn7hMW6zxkUY
    set $ingress_path $http_x_ingress_path;

    location / {
      proxy_pass http://127.0.0.1:8080;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # Don’t let Trilium generate redirects to / that escape ingress.
      proxy_redirect off;

      # If Trilium sets cookies with Path=/, rewrite to ingress path when in ingress
      # (this is harmless when $ingress_path is empty)
      proxy_cookie_path / "$ingress_path/";

      # Rewrite absolute paths in HTML/JS/CSS so they work under ingress prefix.
      sub_filter_once off;
      sub_filter_types text/html application/javascript text/css;

      # API calls
      sub_filter '"/api/' '"$ingress_path/api/';
      sub_filter "'/api/" "'$ingress_path/api/";

      # Common absolute links for assets and navigation
      sub_filter 'href="/' 'href="$ingress_path/';
      sub_filter 'src="/'  'src="$ingress_path/';
      sub_filter 'action="/' 'action="$ingress_path/';

      # If Trilium uses websocket paths with leading slash, keep them under ingress
      sub_filter '"/ws' '"$ingress_path/ws';
      sub_filter "'/ws" "'$ingress_path/ws";

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
