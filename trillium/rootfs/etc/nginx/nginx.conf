worker_processes  1;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  # Needed for websockets
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    client_max_body_size 50m;

    # ------------------------------------------------------------
    # HA Ingress
    # Matches: /api/hassio_ingress/<TOKEN>/...
    # ------------------------------------------------------------
    location ~ ^/api/hassio_ingress/([^/]+)(/.*)?$ {
      # token and remainder path
      set $token $1;
      set $rest  $2;

      # If no remainder, treat as /
      if ($rest = "") { set $rest "/"; }

      # Normalize the one Trilium is picky about
      if ($rest = "/api/search/") { set $rest "/api/search"; }

      # Ingress prefix for rewriting links/cookies
      set $ingress_prefix /api/hassio_ingress/$token;

      # Preserve port in Host to avoid bad absolute URLs (CORS to :80)
      proxy_set_header Host              $http_host;
      proxy_set_header X-Forwarded-Host  $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP         $remote_addr;

      # Websocket headers
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_redirect off;

      # Keep you logged in under the ingress prefix
      proxy_cookie_path / $ingress_prefix/;

      # Let sub_filter see response bodies
      proxy_set_header Accept-Encoding "";

      # CORS: respond to preflight at THIS path (same origin should avoid it,
      # but this prevents "rejected by browser" when something still triggers OPTIONS)
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
      }
      add_header Access-Control-Allow-Origin "*" always;

      # Rewrite absolute paths inside HTML/JS/CSS to include ingress prefix
      sub_filter_once off;
      sub_filter_types text/html text/css application/javascript application/json;

      # Common absolute path patterns
      sub_filter 'href="/'   'href="$ingress_prefix/';
      sub_filter 'src="/'    'src="$ingress_prefix/';
      sub_filter 'action="/' 'action="$ingress_prefix/';

      # API/assets references in JS/JSON
      sub_filter '"/api/'     '"$ingress_prefix/api/';
      sub_filter "'/api/"     "'$ingress_prefix/api/";
      sub_filter '"/assets/'  '"$ingress_prefix/assets/';
      sub_filter "'/assets/"  "'$ingress_prefix/assets/";

      # CSS url() paths
      sub_filter 'url(/'      'url($ingress_prefix/';
      sub_filter 'url("/'     'url("$ingress_prefix/';
      sub_filter "url('/"     "url('$ingress_prefix/";

      # Proxy to Trilium
      proxy_pass http://127.0.0.1:8080$rest$is_args$args;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------
    # Direct access (optional)
    # ------------------------------------------------------------
    location / {
      proxy_set_header Host              $http_host;
      proxy_set_header X-Forwarded-Host  $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP         $remote_addr;

      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_pass http://127.0.0.1:8080;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Normalize search trailing slash (direct mode)
    location = /api/search/ {
      return 308 /api/search$is_args$args;
    }
  }
}
