worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Shared mapping to handle common variables
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        client_max_body_size 50m;

        # Standard Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Disable compression so sub_filter can read the body
        proxy_set_header Accept-Encoding "";

        # ---------------------------------------------------------
        # HELPER: CORS Preflight Handler
        # ---------------------------------------------------------
        set $cors_headers 0;
        if ($request_method = 'OPTIONS') {
            set $cors_headers 1;
        }


        # 1. Catch stray API calls and try to route them
        location /api/ {
            # If a request hits here, it missed the Ingress filter. 
            # We try to proxy it to the backend, but we MUST add CORS here too.
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,X-Requested-With' always;
        
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        
            proxy_pass http://127.0.0.1:8080/api/;
        }
        
        # 2. Catch stray Asset calls (CSS/JS)
        location /assets/ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://127.0.0.1:8080/assets/;
        }
        
        # ---------------------------------------------------------
        # 1 & 2 & 3: Combined Ingress Path Logic
        # This regex catches:
        # /api/hassio_ingress/TOKEN/...
        # /hassio/ingress/SLUG/...
        # /SLUG/ingress/...
        # ---------------------------------------------------------
        location ~ ^(/(?:api/hassio_ingress|hassio/ingress|[^/]+/ingress))/([^/]+)?(/(.*))?$ {
            # Capture the base path (e.g., /api/hassio_ingress/token)
            set $ingress_path $1/$2;
            # Capture the remaining path (e.g., /api/search)
            set $rest $3;

            # Handle trailing slash logic for the API
            if ($rest = "") { set $rest "/"; }
            if ($rest = "/api/search/") { set $rest "/api/search"; }

            # CORS Headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,X-Requested-With,X-HA-Access' always;
            
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                return 204;
            }

            # Proxy to the local app
            proxy_pass http://127.0.0.1:8080$rest$is_args$args;
            proxy_redirect off;
            proxy_cookie_path / $ingress_path/;

            # --- SUB_FILTER BLOCK (Fixes CSS & JS Pathing) ---
            sub_filter_once off;
            # Apply to JS, CSS, and JSON in addition to HTML
            sub_filter_types text/html text/css application/javascript application/json;

            # Catch absolute paths in double quotes
            sub_filter '"/api/' '"$ingress_path/api/';
            sub_filter '"/assets/' '"$ingress_path/assets/';
            
            # Catch absolute paths in single quotes
            sub_filter "'/api/" "'$ingress_path/api/";
            sub_filter "'/assets/" "'$ingress_path/assets/";

            # Catch HTML attributes
            sub_filter 'href="/' 'href="$ingress_path/';
            sub_filter 'src="/'  'src="$ingress_path/';
            sub_filter 'action="/' 'action="$ingress_path/';

            # Catch CSS url() imports (handles both url(/... and url("/...)
            sub_filter 'url(/' 'url($ingress_path/';
            sub_filter 'url("/' 'url("$ingress_path/';
            sub_filter "url('/" "url('$ingress_path/";

            # Fix Base Href
            sub_filter '<base href="/">' '<base href="$ingress_path/">';
            sub_filter '<base href="/"/>' '<base href="$ingress_path/"/>';

            # Timeouts for long-running notes/search operations
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---------------------------------------------------------
        # Direct Access (When not using Ingress)
        # ---------------------------------------------------------
        location / {
            proxy_pass http://127.0.0.1:8080;
            
            # Basic CORS for direct access
            add_header 'Access-Control-Allow-Origin' '*' always;
            
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Redirect legacy search if necessary
        location = /api/search/ {
            return 308 /api/search$is_args$args;
        }
    }
}
