events {}

http {
    server {
        listen 8005;
        location / {
            proxy_pass http://192.168.10.200:8080;
        
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        
            # Remove Trilium’s protective headers so frame works
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            add_header X-Frame-Options "ALLOWALL" always;
            add_header Content-Security-Policy "frame-ancestors *" always;
        
            # Cookie path rewrite for ingress frame access
            proxy_cookie_path ~^/(.*)$ "/2b36e01f_nginx_proxy/ingress/$1; SameSite=None; Secure; HttpOnly";
        }
    }
}
