events {}

http {
server {
    listen 8443 ssl;

    ssl_certificate /ssl/nginx/fullchain.pem;
    ssl_certificate_key /ssl/nginx/privkey.pem;

    location / {
        proxy_pass http://192.168.10.230:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cookie_path / "/; SameSite=None; Secure; HttpOnly";

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options "ALLOWALL" always;
        add_header Content-Security-Policy "frame-ancestors *" always;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        }
    }
}

upstream trilium {
  zone trilium 64k;
  server http://192.168.10.230:8080; # change it to a different hostname and port if non-default is used
  keepalive 2;
}

# This part is for proxy and HTTPS configure
server {
    listen 443 ssl;
    server_name trilium.example.net; #change trilium.example.net to your domain without HTTPS or HTTP.
    ssl_certificate /ssl/nginx/fullchain.pem;
    ssl_certificate_key /ssl/nginx/privkey.pem;
    ssl_session_cache builtin:1000 shared:SSL:10m;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers HIGH:!aNULL:!eNULL:!EXPORT:!CAMELLIA:!DES:!MD5:!PSK:!RC4;
    ssl_prefer_server_ciphers on;
    access_log /var/log/nginx/access.log; #check the path of access.log, if it doesn't fit your file, change it

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://trilium;
        proxy_read_timeout 90;
    }
}

# This part is for HTTPS forced
server {
    listen 80;
    server_name trilium.example.net; # change to your domain
    return 301 https://$server_name$request_uri;
}
