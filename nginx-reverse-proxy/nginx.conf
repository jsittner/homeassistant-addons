events {}

http {
    server {
        listen 80;

        location / {
            proxy_pass http://192.168.10.230:8080;
            # These headers tell the backend about the original request.
            # This is what solves the CSRF and session issues.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # This header is the most important for your problem.
            # It tells the backend that the original client request was HTTPS.
            proxy_set_header X-Forwarded-Proto $scheme; 
        }
    }
}
