events {}

http {
    server {
        listen 8005;
        location / {
            proxy_pass http://192.168.10.200:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        
            # Remove restrictive headers Trilium may set
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
        
            add_header X-Frame-Options "ALLOWALL" always;
            add_header Content-Security-Policy "frame-ancestors *" always;
        
            # This is the fix for session cookies via ingress iframe
            proxy_cookie_path / "/api/hassio_ingress/2b36e01f_nginx_proxy/; SameSite=None; Secure; HttpOnly";
        
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

        }
    }
}
